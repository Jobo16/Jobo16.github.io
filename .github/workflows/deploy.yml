name: Deploy JOBO homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobo-ink-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html favicon.svg robots.txt sitemap.xml *-qr.jpg _site/
          grep -q 'JOBO 周博' _site/index.html
          if grep -Eq 'yourusername|your@email|Your Name|ICP备|公网安备' _site/index.html; then
            echo 'Unexpected placeholder or removed footer text in index.html' >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          JOBO_INK_DEPLOY_KEY: ${{ secrets.JOBO_INK_DEPLOY_KEY }}
        run: |
          test -n "$JOBO_INK_DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$JOBO_INK_DEPLOY_KEY" > ~/.ssh/jobo_ink_deploy
          chmod 600 ~/.ssh/jobo_ink_deploy
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e 'ssh -i ~/.ssh/jobo_ink_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' \
            _site/ jobo-ink-deploy@119.28.238.248:/srv/sites/jobo-ink/

      - name: Verify published page
        run: |
          expected="$(sha256sum _site/index.html | cut -d' ' -f1)"
          actual="$(ssh -i ~/.ssh/jobo_ink_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            jobo-ink-deploy@119.28.238.248 sha256sum /srv/sites/jobo-ink/index.html | cut -d' ' -f1)"
          test "$expected" = "$actual"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --resolve jobo.ink:443:119.28.238.248 https://jobo.ink/ | grep -q 'JOBO 周博'
